name: docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docfx.json'
      - 'toc.yml'
      - 'api/index.md'
  # Pull requests build the site too, so a broken link fails before merge (plan G2.1 c); only main deploys.
  # No path filter: "Build DocFX" is a required check, and a required check that never runs blocks the PR.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: true

permissions:
  contents: read

# ImageSharp 4 validates a Six Labors license at Release build time (decisions/2026-10-14-sdk-10.0.402-imagesharp-4.md);
# SixLaborsLicenseKey is set only on the steps that build or load the projects, not on every step and action.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-docs:
    name: Build DocFX
    runs-on: ubuntu-latest
    # Read-only: it also runs for pull requests; publishing needs pages/id-token only in deploy-pages.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # git blame / contributor info

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore solution (generates XML doc files)
        run: dotnet restore --locked-mode

      - name: Build (generates XML docs, needed by DocFX metadata)
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet build --configuration Release --no-restore

      # Pinned in .config/dotnet-tools.json (checked by the license gate); decisions/2026-10-29-ci-tools-pinned.md
      - name: Install DocFX
        run: dotnet tool restore

      - name: Generate API metadata
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet docfx metadata docfx.json --logLevel verbose

      # Warnings fail the build: broken file links and bookmarks in the published pages. API metadata warnings (crefs
      # inherited from EF Core's XML docs) come from the step above and are not gated (plan R7).
      - name: Build static site
        run: dotnet docfx build docfx.json --warningsAsErrors

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
