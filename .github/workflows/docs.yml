name: docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docfx.json'
      - 'toc.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ImageSharp 4 validates a Six Labors license at Release build time; see decisions/2026-10-14-sdk-10.0.402-imagesharp-4.md
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-docs:
    name: Build & Deploy DocFX
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # git blame / contributor info

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore solution (generates XML doc files)
        run: dotnet restore --locked-mode

      - name: Build (generates XML docs, needed by DocFX metadata)
        run: dotnet build --configuration Release --no-restore

      # Pinned in .config/dotnet-tools.json (checked by the license gate); decisions/2026-10-29-ci-tools-pinned.md
      - name: Install DocFX
        run: dotnet tool restore

      - name: Generate API metadata
        run: dotnet docfx metadata docfx.json --logLevel verbose

      - name: Build static site
        run: dotnet docfx build docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
