name: license-audit

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  # Scheduled run also catches exceptions that expire without any code change.
  schedule:
    - cron: '0 6 * * 1'  # Her Pazartesi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  audit:
    name: License Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore --locked-mode

      # Local tools (.config/dotnet-tools.json) are checked too; an unrestored tool fails the gate (fail-closed).
      - name: Restore local tools
        run: dotnet tool restore

      # Fail-closed gate over every packages.lock.json (decisions/2026-10-26-license-gate.md, docs/licensing.md).
      # Unknown, unreviewed, changed-text or expired-exception licenses fail the job; so does any gate error.
      - name: Test license gate
        run: python3 -I -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Run license gate
        run: |
          mkdir -p artifacts
          python3 -I .github/scripts/license_gate.py \
            --root . \
            --policy .github/license-policy.json \
            --report artifacts/license-report.md
        shell: bash

      - name: Publish license report
        if: always()
        run: |
          if [ -f artifacts/license-report.md ]; then
            cat artifacts/license-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: artifacts/license-report.md
          if-no-files-found: ignore
          retention-days: 90
