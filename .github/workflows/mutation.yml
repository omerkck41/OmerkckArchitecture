name: mutation

on:
  # Weekly — Sundays 02:00 UTC. Mutation testing is slow (5-15 min per module);
  # running on every PR would block delivery, so schedule-only is intentional.
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to test (core | caching | security | totp | localization | jwt | pipeline | persistence | all)'
        required: false
        default: 'all'

permissions:
  contents: read

env:
  # ImageSharp 4 validates a Six Labors license at Release build time; see decisions/2026-10-14-sdk-10.0.402-imagesharp-4.md
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  mutation:
    name: Mutation Testing — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: core
            config: stryker-config.json
          - module: caching
            config: stryker-caching.json
          - module: security
            config: stryker-security.json
          - module: totp
            config: stryker-totp.json
          - module: localization
            config: stryker-localization.json
          - module: jwt
            config: stryker-jwt.json
          - module: pipeline
            config: stryker-pipeline.json
          - module: persistence
            config: stryker-persistence.json

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Install Stryker.NET
        run: dotnet tool restore

      - name: Run mutation tests — ${{ matrix.module }}
        run: dotnet stryker --config-file ${{ matrix.config }} --output mutation-report/${{ matrix.module }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.module }}
          path: mutation-report/${{ matrix.module }}/**
          retention-days: 30
