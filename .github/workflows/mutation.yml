name: mutation

on:
  # Weekly — Sundays 02:00 UTC. Mutation testing is slow (5-15 min per module);
  # running on every PR would block delivery, so schedule-only is intentional.
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      module:
        description: 'Informational only: every module in the matrix runs'
        required: false
        default: 'all'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  mutation:
    name: Mutation Testing — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: core
            config: stryker-config.json
          - module: caching
            config: stryker-caching.json
          - module: security
            config: stryker-security.json
          - module: totp
            config: stryker-totp.json
          - module: localization
            config: stryker-localization.json
          - module: jwt
            config: stryker-jwt.json
          - module: pipeline
            config: stryker-pipeline.json
          - module: persistence
            config: stryker-persistence.json
          # H20 (2026-10-29): break = unit-test score minus ~5 (ratchet; raise as tests grow).
          - module: observability
            config: stryker-observability.json
          - module: http-resilience
            config: stryker-http-resilience.json
          - module: backgroundjobs
            config: stryker-backgroundjobs.json
          - module: documents-closedxml
            config: stryker-documents-closedxml.json
          - module: documents-skiasharp
            config: stryker-documents-skiasharp.json
          - module: filestorage-awss3
            config: stryker-filestorage-awss3.json
          - module: filestorage-azureblob
            config: stryker-filestorage-azureblob.json
          - module: filestorage-fluentftp
            config: stryker-filestorage-fluentftp.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Install Stryker.NET
        run: dotnet tool restore

      - name: Run mutation tests — ${{ matrix.module }}
        run: dotnet stryker --config-file ${{ matrix.config }} --output mutation-report/${{ matrix.module }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.module }}
          path: mutation-report/${{ matrix.module }}/**
          retention-days: 30
