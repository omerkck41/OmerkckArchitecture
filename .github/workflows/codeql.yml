name: codeql

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  schedule:
    - cron: '33 3 * * 1'  # Mondays 03:33 UTC
  # Dispatched by dependabot-lockfile after it pushes regenerated lock files (GITHUB_TOKEN pushes start no run).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  # ImageSharp 4 validates a Six Labors license at Release build time; see decisions/2026-10-14-sdk-10.0.402-imagesharp-4.md
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml

      - name: Build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      # paths-ignore does not apply to a built C# analysis, so results in source-generator output (obj/) are removed
      # from the SARIF before upload; see decisions/2026-10-31-codeql-generated-code.md.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          upload: failure-only
          output: sarif-results

      - name: Drop results in build output
        run: python3 -I .github/scripts/codeql_sarif_filter.py

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"
