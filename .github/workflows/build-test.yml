name: build-test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # ImageSharp 4 validates a Six Labors license at Release build time; see decisions/2026-10-14-sdk-10.0.402-imagesharp-4.md
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # MinVer needs full history for tag resolution

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Audit transitive dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1 || true)
          echo "$OUTPUT"
          # Honour documented, project-scoped <NuGetAuditSuppress> entries (restore already enforces them).
          # Only dedicated *.AuditSuppress.props files count, parsed as XML (comments ignored) so this
          # gate cannot diverge from MSBuild. Each suppression stays visible; anything else still fails.
          SUPPRESSED=$(git ls-files '*.AuditSuppress.props' | python3 -I -c '
          import sys, xml.etree.ElementTree as ET
          urls = set()
          for path in filter(None, sys.stdin.read().split("\n")):
              text = open(path, encoding="utf-8").read()
              if "<!DOCTYPE" in text.upper() or "<!ENTITY" in text.upper():
                  sys.exit(f"{path}: DOCTYPE/ENTITY not allowed in audit suppression files")
              for item in ET.fromstring(text).iter("NuGetAuditSuppress"):
                  url = (item.get("Include") or "").strip()
                  if url.startswith("https://github.com/advisories/GHSA-"):
                      urls.add(url)
          print("\n".join(sorted(urls)))' | tr -d '\r')
          if [ -n "$SUPPRESSED" ]; then
            while IFS= read -r url; do echo "::warning::Suppressed (documented, temporary) advisory: $url"; done <<< "$SUPPRESSED"
            OUTPUT=$(echo "$OUTPUT" | grep -vF -f <(printf '%s\n' "$SUPPRESSED") || true)
          fi
          if echo "$OUTPUT" | grep -E '\b(Critical|High)\b' >/dev/null; then
            echo "::error::Critical or High severity CVE found in dependencies"
            exit 1
          fi
          if echo "$OUTPUT" | grep -E '\b(Moderate|Medium)\b' >/dev/null; then
            echo "::warning::Moderate severity CVE found — schedule remediation"
          fi

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (unit)
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            -- RunConfiguration.CollectSourceInformation=true
        shell: bash

      - name: Test (integration, ubuntu-only — Docker required)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./TestResults
        shell: bash

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults
          retention-days: 14

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
          retention-days: 14

      - name: Merge coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            -reports:'**/coverage.cobertura.xml' \
            -targetdir:./coverage-report \
            -reporttypes:'Cobertura;TextSummary;MarkdownSummaryGithub'
          cat ./coverage-report/Summary.txt
        shell: bash

      - name: Publish coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: cat ./coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Enforce coverage threshold
        if: matrix.os == 'ubuntu-latest'
        env:
          # Faz-B2 Kademe 1 — gercek olcum (2026-05-17): line %43.7, branch %38.7.
          # Hedef %50/%45 icin ek testler gerekiyor (Kademe 2 oncesi).
          # Yol haritasi: docs/policies/test-coverage.md
          LINE_THRESHOLD: '43'
          BRANCH_THRESHOLD: '38'
        run: |
          LINE=$(awk '/Line coverage:/ {gsub("%",""); print $3; exit}' ./coverage-report/Summary.txt)
          BRANCH=$(awk '/Branch coverage:/ {gsub("%",""); print $3; exit}' ./coverage-report/Summary.txt)
          echo "Line:   ${LINE}% (threshold ${LINE_THRESHOLD}%)"
          echo "Branch: ${BRANCH}% (threshold ${BRANCH_THRESHOLD}%)"
          FAIL=0
          awk "BEGIN { exit !(${LINE:-0} < ${LINE_THRESHOLD}) }" && {
            echo "::error::Line coverage ${LINE}% below threshold ${LINE_THRESHOLD}%"; FAIL=1;
          } || true
          awk "BEGIN { exit !(${BRANCH:-0} < ${BRANCH_THRESHOLD}) }" && {
            echo "::error::Branch coverage ${BRANCH}% below threshold ${BRANCH_THRESHOLD}%"; FAIL=1;
          } || true
          exit $FAIL
        shell: bash
