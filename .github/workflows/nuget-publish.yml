name: nuget-publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Must be an existing tag.'
        required: true

permissions:
  contents: read

env:
  # ImageSharp 4 validates a Six Labors license at Release build time; see decisions/2026-10-14-sdk-10.0.402-imagesharp-4.md
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack & Push to NuGet
    runs-on: ubuntu-latest
    # Protected environment: the job waits for maintainer approval and only then can read the
    # environment-scoped NUGET_API_KEY. nuget.org cannot delete packages — see ADR-0027.
    environment: nuget

    steps:
      # Validate the tag before anything else; the raw input reaches the shell only through an env var
      # and is never echoed (zizmor template-injection).
      - name: Resolve version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "VERSION=${TAG_INPUT#v}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # MinVer requires full tag history
          fetch-tags: true # MinVer needs tags; actions/checkout defaults to false
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:MinVerVersionOverride="$VERSION"

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:MinVerVersionOverride="$VERSION"

      - name: Generate SBOM
        # SBOM is a best-effort artifact — never block NuGet push on SBOM generation failure.
        continue-on-error: true
        run: |
          dotnet tool restore
          dotnet CycloneDX OmerkckArchitecture.sln \
            --output ./artifacts \
            --filename "kck-sbom-$VERSION" \
            --output-format Json \
            --exclude-test-projects \
            --set-type Library \
            --set-version "$VERSION"
        shell: bash

      - name: Upload SBOM artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ./artifacts/kck-sbom-*.json
          retention-days: 90

      - name: Upload packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          retention-days: 30

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
