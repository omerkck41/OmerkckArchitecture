name: nuget-publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish or unlist (e.g. v1.0.0). Must be an existing tag.'
        required: true
      mode:
        description: 'publish: build and push the tag. unlist: unlist the packages a successful publish of the tag pushed (run from main).'
        type: choice
        options:
          - publish
          - unlist
        default: publish

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Builds, tests and packs the tagged commit. Runs repository code and third-party tools, so it has
  # NO OIDC permission and no environment: nothing here can obtain a NuGet publish key.
  build:
    name: Build, Test & Pack
    if: github.event.inputs.mode != 'unlist'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # ImageSharp 4 validates a Six Labors license at Release build time; see decisions/2026-10-14-sdk-10.0.402-imagesharp-4.md
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      # Validate the tag before anything else; the raw input reaches the shell only through an env var
      # and is never echoed (zizmor template-injection).
      - name: Resolve version
        id: version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "VERSION=${TAG_INPUT#v}" >> "$GITHUB_ENV"
          echo "version=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # MinVer requires full tag history
          fetch-tags: true # MinVer needs tags; actions/checkout defaults to false
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:MinVerVersionOverride="$VERSION"

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:MinVerVersionOverride="$VERSION"

      - name: Generate SBOM
        # SBOM is a best-effort artifact — never block NuGet push on SBOM generation failure.
        continue-on-error: true
        run: |
          dotnet tool restore
          dotnet CycloneDX OmerkckArchitecture.sln \
            --output ./artifacts \
            --filename "kck-sbom-$VERSION" \
            --output-format Json \
            --exclude-test-projects \
            --set-type Library \
            --set-version "$VERSION"
        shell: bash

      - name: Upload SBOM artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ./artifacts/kck-sbom-*.json
          retention-days: 90

      - name: Upload packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          retention-days: 30
          if-no-files-found: error

  # Pushes the packages built above. Runs no repository code. Waits for maintainer approval in the
  # protected `nuget` environment; nuget.org's Trusted Publishing policy is bound to this repo, this
  # workflow file and this environment, so only this approved job can obtain a publish key.
  # nuget.org cannot delete packages — see ADR-0027.
  publish:
    name: Push to NuGet
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'unlist')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write   # GitHub OIDC token for NuGet Trusted Publishing (short-lived key exchange)

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      # Trusted Publishing: exchange the OIDC token for a single-use API key valid for 1 hour,
      # immediately before the push. No long-lived key is stored anywhere.
      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: omerkck   # nuget.org profile name (package owner), not the GitHub handle

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      # Keep only the newest stable version of each major listed on nuget.org. Runs only after a successful
      # push. Unlisting hides a version from search; it is not deleted, still restores by exact version and
      # can be relisted. Only LOWER stable versions of the SAME major are touched, so publishing 4.0.0 keeps
      # the newest 3.x listed for consumers who cannot move yet; pre-releases unlist nothing.
      # Inline (not a repo script) so this privileged job still runs no repository code. The functions above
      # the "--- main ---" marker are pure and tested by .github/scripts/test_unlist_selection.py.
      - name: Unlist older versions
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: python
        run: |
          import glob, gzip, json, os, re, subprocess, sys, time, urllib.error, urllib.request, zipfile

          def key(v):
              return tuple(int(x) for x in v.split("+")[0].split("-")[0].split("."))

          def is_prerelease(v):
              return "-" in v.split("+")[0]

          def to_unlist(version, listed):
              if is_prerelease(version):
                  return []
              return [v for v in listed
                      if not is_prerelease(v) and key(v)[0] == key(version)[0] and key(v) < key(version)]

          # --- main ---
          version = os.environ["VERSION"]
          if is_prerelease(version):
              print(f"{version} is a pre-release: nothing is unlisted.")
              sys.exit(0)

          def get_json(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  raw = r.read()
              return json.loads(gzip.decompress(raw) if raw[:2] == b"\x1f\x8b" else raw)

          ids = set()
          for path in glob.glob("artifacts/*.nupkg"):
              with zipfile.ZipFile(path) as z:
                  nuspec = next(n for n in z.namelist() if n.endswith(".nuspec") and "/" not in n)
                  meta = z.read(nuspec).decode("utf-8")
              pid = re.search(r"<id>([^<]+)</id>", meta).group(1)
              pver = re.search(r"<version>([^<]+)</version>", meta).group(1)
              if pver != version:
                  sys.exit(f"{path}: package version {pver} does not match {version}; refusing to unlist anything")
              ids.add(pid)
          if not ids:
              sys.exit("no packages found in ./artifacts")

          failures, done = [], 0
          for pid in sorted(ids):
              url = f"https://api.nuget.org/v3/registration5-gz-semver2/{pid.lower()}/index.json"
              try:
                  index = get_json(url)
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print(f"{pid}: no earlier versions on nuget.org")
                      continue
                  raise
              entries = []
              for page in index["items"]:
                  entries += page["items"] if "items" in page else get_json(page["@id"])["items"]
              old = to_unlist(version, [e["catalogEntry"]["version"] for e in entries
                                        if e["catalogEntry"].get("listed", True)])
              for v in old:
                  for attempt in range(3):
                      r = subprocess.run(["dotnet", "nuget", "delete", pid, v, "--non-interactive",
                                          "--api-key", os.environ["NUGET_API_KEY"],
                                          "--source", "https://api.nuget.org/v3/index.json"],
                                         capture_output=True, text=True)
                      if r.returncode == 0:
                          done += 1
                          print(f"unlisted {pid} {v}")
                          break
                      time.sleep(5 * (attempt + 1))
                  else:
                      failures.append(f"{pid} {v}")
                      print(f"::warning::could not unlist {pid} {v}")
                  time.sleep(0.3)
          print(f"unlisted {done} version(s) across {len(ids)} package(s)")
          if failures:
              sys.exit(f"{len(failures)} version(s) could not be unlisted: {', '.join(failures[:10])}")

  # Manual unlist of one released version (workflow_dispatch, mode: unlist). Same protections as publish:
  # waits for approval in the protected `nuget` environment, gets a short-lived key through Trusted
  # Publishing and runs no repository code. The package ids come from the `nupkgs` artifact of the tag's
  # successful tag-push publish run (kept 30 days), not from nuget.org search, whose index can lag.
  # Unlisting only hides the version; it still restores by exact version and can be relisted on nuget.org.
  unlist:
    name: Unlist on NuGet
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'unlist'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write   # GitHub OIDC token for NuGet Trusted Publishing
      actions: read     # find the tag's publish run and download its package artifact

    steps:
      - name: Resolve version and publish run
        id: source
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ ! "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          # The run must have built the commit the tag points at; a branch with the tag's name, or a tag
          # pushed again to another commit, must not pick the package set.
          tag_sha=$(gh api "repos/$REPO/commits/$TAG_INPUT" --jq .sha)
          if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the tag to a commit"
            exit 1
          fi
          run_ids=$(gh run list --repo "$REPO" --workflow nuget-publish.yml --branch "$TAG_INPUT" \
            --event push --status success --limit 20 --json databaseId,headSha \
            --jq "[.[] | select(.headSha == \"$tag_sha\") | .databaseId | tostring] | join(\" \")")
          read -r -a runs <<< "$run_ids"
          if [[ ${#runs[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one successful tag-push publish run for this tag's commit, found ${#runs[@]}"
            exit 1
          fi
          run_id="${runs[0]}"
          echo "version=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the packages that publish pushed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: ./artifacts
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: omerkck   # nuget.org profile name (package owner), not the GitHub handle

      - name: Unlist the version
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.source.outputs.version }}
        shell: python
        run: |
          import glob, gzip, json, os, re, subprocess, sys, time, urllib.error, urllib.request, zipfile

          def decide(version, entries):
              """entries: (version, listed) pairs from the registration. NuGet versions compare case-insensitively."""
              states = [listed for v, listed in entries if v.lower() == version.lower()]
              if not states:
                  return "missing"
              return "delete" if any(states) else "skip"

          # --- main ---
          version = os.environ["VERSION"]

          def get_json(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  raw = r.read()
              return json.loads(gzip.decompress(raw) if raw[:2] == b"\x1f\x8b" else raw)

          ids = set()
          for path in glob.glob("artifacts/*.nupkg"):
              with zipfile.ZipFile(path) as z:
                  nuspec = next(n for n in z.namelist() if n.endswith(".nuspec") and "/" not in n)
                  meta = z.read(nuspec).decode("utf-8")
              pid = re.search(r"<id>([^<]+)</id>", meta).group(1)
              pver = re.search(r"<version>([^<]+)</version>", meta).group(1)
              if pver != version:
                  sys.exit(f"{path}: package version {pver} does not match {version}; refusing to unlist anything")
              ids.add(pid)
          if not ids:
              sys.exit("no packages found in ./artifacts")

          failures, done, skipped = [], 0, 0
          for pid in sorted(ids):
              url = f"https://api.nuget.org/v3/registration5-gz-semver2/{pid.lower()}/index.json"
              try:
                  index = get_json(url)
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      failures.append(f"{pid} (not on nuget.org)")
                      continue
                  raise
              entries = []
              for page in index["items"]:
                  entries += page["items"] if "items" in page else get_json(page["@id"])["items"]
              action = decide(version, [(e["catalogEntry"]["version"], e["catalogEntry"].get("listed", True))
                                        for e in entries])
              if action == "missing":
                  failures.append(f"{pid} {version} (not in the registration)")
                  continue
              if action == "skip":
                  skipped += 1
                  print(f"{pid} {version}: already unlisted")
                  continue
              for attempt in range(3):
                  r = subprocess.run(["dotnet", "nuget", "delete", pid, version, "--non-interactive",
                                      "--api-key", os.environ["NUGET_API_KEY"],
                                      "--source", "https://api.nuget.org/v3/index.json"],
                                     capture_output=True, text=True)
                  if r.returncode == 0:
                      done += 1
                      print(f"unlisted {pid} {version}")
                      break
                  time.sleep(5 * (attempt + 1))
              else:
                  failures.append(f"{pid} {version}")
                  print(f"::warning::could not unlist {pid} {version}")
              time.sleep(0.3)
          print(f"unlisted {done}, already unlisted {skipped}, of {len(ids)} package(s)")
          if failures:
              sys.exit(f"{len(failures)} package(s) could not be unlisted: {', '.join(failures[:10])}")
