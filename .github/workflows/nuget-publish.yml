name: nuget-publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Must be an existing tag.'
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack & Push to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # MinVer requires full tag history
          fetch-tags: true # MinVer needs tags; actions/checkout@v6 defaults to false

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.203'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:MinVerVersionOverride=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:MinVerVersionOverride=${{ steps.version.outputs.version }}

      - name: Generate SBOM
        # SBOM is a best-effort artifact — never block NuGet push on SBOM generation failure.
        continue-on-error: true
        run: |
          dotnet tool restore
          dotnet CycloneDX OmerkckArchitecture.sln \
            --output ./artifacts \
            --filename kck-sbom-${{ steps.version.outputs.version }} \
            --output-format Json \
            --exclude-test-projects \
            --set-type Library \
            --set-version ${{ steps.version.outputs.version }}
        shell: bash

      - name: Upload SBOM artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ./artifacts/kck-sbom-*.json
          retention-days: 90

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          retention-days: 30

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
