name: dependabot-lockfile

# Dependabot, Directory.Packages.props'taki CentralTransitive bağımlılıkları
# güncellerken packages.lock.json dosyalarını yenilemez. Bu workflow, lock
# dosyalarını otomatik olarak yeniler ve PR branch'ine commit eder — böylece
# --locked-mode ile çalışan CI workflow'ları başarısız olmaz.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'Directory.Packages.props'

permissions:
  contents: write

jobs:
  update-lockfiles:
    name: Regenerate lock files
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true  # this job pushes regenerated lock files back to the PR branch
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.402'

      - name: Regenerate lock files
        env:
          DOTNET_NOLOGO: true
          DOTNET_CLI_TELEMETRY_OPTOUT: true
        run: dotnet restore --force-evaluate

      - name: Commit updated lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/packages.lock.json'
          if git diff --staged --quiet; then
            echo "Lock files already up-to-date — nothing to commit"
          else
            git commit -m "chore: regenerate lock files for dependency update"
            git push
          fi
