name: benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmark
  cancel-in-progress: false  # gh-pages history must not be interrupted mid-write

permissions:
  # Required by benchmark-action to push results to gh-pages and write PR comments.
  contents: write
  deployments: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmark:
    name: Performance Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.203'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run benchmarks
        run: |
          dotnet run \
            --project tests/Kck.Benchmarks/Kck.Benchmarks.csproj \
            --configuration Release \
            --no-build \
            -- \
            --filter '*' \
            --exporters json \
            --artifacts "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts"
        shell: bash

      - name: Merge benchmark JSON reports
        run: |
          shopt -s nullglob
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts" -name '*-report*.json' ! -name 'merged-report.json' -print0 2>/dev/null)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No benchmark JSON output found."
            echo "Artifacts directory contents:"
            find "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts" -type f 2>/dev/null || echo "(empty or missing)"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results"
          jq -s '{"Title":"Kck Benchmarks","Benchmarks":[.[].Benchmarks[]]}' \
            "${files[@]}" \
            > "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results/merged-report.json"
        shell: bash

      - name: Store benchmark results / detect regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: benchmarkdotnet
          output-file-path: ${{ github.workspace }}/BenchmarkDotNet.Artifacts/results/merged-report.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Persist results to the gh-pages branch so successive runs can compare.
          auto-push: true
          # Fail the workflow if any benchmark regresses more than 10%.
          alert-threshold: '110%'
          fail-on-alert: true
          comment-on-alert: true
          # Summary comment in PRs (no push required — read-only comment).
          summary-always: true
