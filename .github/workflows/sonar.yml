name: sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

# ImageSharp 4 validates a Six Labors license at Release build time (decisions/2026-10-14-sdk-10.0.402-imagesharp-4.md);
# SixLaborsLicenseKey is set only on the Build step, and SONAR_TOKEN only on the scanner steps, as environment variables.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SONAR_PROJECT_KEY: omerkck41_OmerkckArchitecture
  SONAR_ORG: omerkck41

jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # shallow clone breaks blame-based analysis

      - name: Setup Java (SonarScanner requires JDK 17+)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      # Pinned in .config/dotnet-tools.json (checked by the license gate); decisions/2026-10-29-ci-tools-pinned.md
      - name: Install SonarScanner for .NET
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORG" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/obj/**,**/bin/**,tests/**,samples/**" \
            /d:sonar.coverage.exclusions=".github/scripts/**"
        shell: bash

      - name: Build
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage (unit)
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --filter "Category!=Integration" \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory ./TestResults
        shell: bash

      # The broker-backed providers (RabbitMQ, Redis, Elasticsearch, Postgres) are exercised only by the Testcontainers
      # suites; without them the new-code coverage of a provider change is not measured (PR #286: 51.9 %). Docker is
      # available on ubuntu-latest, and build-test.yml already runs the same suites there.
      - name: Test with coverage (integration, Docker)
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --filter "Category=Integration" \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory ./TestResults
        shell: bash

      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
