name: Template problem
description: A project created with `dotnet new kck-webapi` does not build, run or pass its tests.
title: "template: "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The command and the output below let us reproduce it in the template smoke test.
  - type: input
    id: command
    attributes:
      label: Command
      description: The `dotnet new` command you ran, with its options.
      placeholder: dotnet new kck-webapi -n Shop --database postgres
    validations:
      required: true
  - type: input
    id: template-version
    attributes:
      label: Template version
      description: The output of `dotnet new list kck-webapi` or the version you installed (`Kck.Templates::x.y.z`).
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Where does it fail?
      options:
        - dotnet new (creating the project)
        - dotnet build
        - dotnet run / the API
        - dotnet test
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error or the unexpected output. It is shown as text.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `dotnet --info` (SDK and runtime versions), operating system, database if not SQLite.
      render: text
    validations:
      required: true
