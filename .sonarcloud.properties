# Kck.Pipeline.MediatR and Kck.Pipeline.Mediator behaviors are intentional parallel
# framework adapters wrapping the same business logic for two different pipeline
# frameworks (MediatR and Mediator.Abstractions). The structural similarity is by
# design — they are thin adapter wrappers, not copy-pasted code.
sonar.cpd.exclusions=src/Providers/Kck.Pipeline.MediatR/Behaviors/**,src/Providers/Kck.Pipeline.Mediator/Behaviors/**

# CI helper scripts are Python; their unittest suite runs in the license-audit workflow, which produces no coverage
# report Sonar can import (that would need an extra package). Exclude them from coverage only — issues still apply.
# The CI scanner (sonar.yml) does not read this file and passes the same exclusion as a scanner parameter.
sonar.coverage.exclusions=.github/scripts/**
